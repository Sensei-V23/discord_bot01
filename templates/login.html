<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Clan Attendance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700/60 p-8 rounded-2xl shadow-2xl w-full max-w-md space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-sky-400">🔒 เข้าสู่ระบบหลังบ้าน</h1>
            <p class="text-slate-400 text-sm">กรุณากรอกชื่อผู้ใช้และรหัสผ่านเพื่อเข้าใช้งาน</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm p-3 rounded-lg text-center font-medium">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-1">Username (ชื่อผู้ใช้)</label>
                <input type="text" name="username" required autocomplete="username" placeholder="กรอก Username..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-sky-500 transition">
            </div>
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-1">Password (รหัสผ่าน)</label>
                <input type="password" name="password" required autocomplete="current-password" placeholder="กรอก Password..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-sky-500 transition">
            </div>
            
            <!-- ช่องติ๊กจดจำการล็อกอิน -->
            <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 cursor-pointer text-sm text-slate-300">
                    <input type="checkbox" name="remember" value="true" checked class="w-4 h-4 accent-sky-500 rounded border-slate-700 bg-slate-900">
                    <span>จดจำการล็อกอิน (30 วัน)</span>
                </label>
            </div>

            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-2.5 rounded-lg transition shadow-lg shadow-sky-600/20">
                เข้าสู่ระบบ
            </button>
        </form>
    </div>
</body>
</html>
